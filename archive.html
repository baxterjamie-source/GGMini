<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The GG Mini — Archive &amp; High Scores</title>
<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --line:#000;
    --gray:#f6f6f6;
    --border-gray:#d3d6da;
    --gold:#c9a227;
    --silver:#8a8f98;
    --bronze:#b0662e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  body{
    width:100%;
    display:flex;justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    padding:18px 14px 40px;
  }
  .masthead{
    text-align:center;
    margin-bottom:18px;
  }
  .masthead .kicker{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#767676;
    font-weight:600;
  }
  .masthead h1{
    font-family:"Times New Roman",Georgia,serif;
    font-weight:700;
    font-size:34px;
    margin:2px 0 0;
    letter-spacing:0.5px;
  }
  .masthead .sub{
    font-size:12px;
    color:#767676;
    margin-top:4px;
  }

  .puzzle-card{
    border:1px solid var(--border-gray);
    border-radius:10px;
    margin-bottom:18px;
    overflow:hidden;
    scroll-margin-top:16px;
  }
  .puzzle-card.highlight{
    border-color:#000;
    box-shadow:0 0 0 2px #000;
  }
  .puzzle-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:var(--gray);
    border-bottom:1px solid var(--border-gray);
  }
  .puzzle-card-head .title{
    font-family:"Times New Roman",Georgia,serif;
    font-size:18px;
    font-weight:700;
  }
  .puzzle-card-head .date{
    font-size:11px;
    color:#767676;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:2px;
  }
  .play-btn{
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:uppercase;
    text-decoration:none;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid #000;
    background:#000;
    color:#fff;
    white-space:nowrap;
  }
  .play-btn:active{opacity:0.8;}

  table.scores{
    width:100%;
    border-collapse:collapse;
  }
  table.scores td, table.scores th{
    padding:8px 16px;
    font-size:14px;
    text-align:left;
  }
  table.scores th{
    font-size:10px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:#767676;
    padding-top:12px;
    padding-bottom:4px;
  }
  table.scores th.num, table.scores td.rank{width:34px;}
  table.scores td.initials{
    font-weight:700;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  table.scores td.time{
    text-align:right;
    font-variant-numeric:tabular-nums;
    color:#333;
  }
  table.scores tr.rank-1 .rank{color:var(--gold);font-weight:700;}
  table.scores tr.rank-2 .rank{color:var(--silver);font-weight:700;}
  table.scores tr.rank-3 .rank{color:var(--bronze);font-weight:700;}

  .empty-state, .loading-state, .error-state{
    padding:16px;
    font-size:13px;
    color:#767676;
    text-align:center;
  }
  .error-state{color:#b0332e;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="kicker">Crossword</div>
    <h1>The GG Mini</h1>
    <div class="sub">Archive &amp; High Scores</div>
  </div>

  <div id="puzzleList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, query, where, getDocs, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPRO3fS8hrhU2Mbe17U9TEgx1IR3ig3T0",
  authDomain: "gg-mini-crossword.firebaseapp.com",
  projectId: "gg-mini-crossword",
  storageBucket: "gg-mini-crossword.firebasestorage.app",
  messagingSenderId: "1059859771208",
  appId: "1:1059859771208:web:43d0f51b589e903a9dcd7d",
  measurementId: "G-T5PV4F7KT2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- Puzzle list ----------
// Add a new line here each time a new puzzle is published.
const PUZZLES = [
  { id: 'gg-mini-2026-09-02', num: 3, dateLabel: 'September 2, 2026', file: 'gg-mini-2026-09-02.html' },
  { id: 'gg-mini-2026-09-01', label: 'Bonus Puzzle', dateLabel: 'September 1, 2026', file: 'gg-mini-2026-09-01.html' },
  { id: 'gg-mini-2026-08-30', num: 2, dateLabel: 'August 30, 2026', file: 'gg-mini-2026-08-30.html' },
  { id: 'gg-mini-2026-08-26', num: 1, dateLabel: 'August 26, 2026', file: 'gg-mini-2026-08-26.html' },
];

function formatTime(ms){
  const secs = Math.floor(ms/1000);
  const m = Math.floor(secs/60), s = secs%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function releaseDateFromId(id){
  const m = id.match(/(\d{4}-\d{2}-\d{2})$/);
  return m ? new Date(m[1] + 'T00:00:00') : new Date(0);
}
const now = new Date();
const RELEASED_PUZZLES = PUZZLES.filter(p => releaseDateFromId(p.id) <= now);

const listEl = document.getElementById('puzzleList');
const hashId = (location.hash || '').replace('#','');

RELEASED_PUZZLES.forEach(p=>{
  const card = document.createElement('div');
  card.className = 'puzzle-card' + (p.id===hashId ? ' highlight' : '');
  card.id = p.id;

  card.innerHTML = `
    <div class="puzzle-card-head">
      <div>
        <div class="title">${p.label || ('Puzzle ' + p.num)}</div>
        <div class="date">${p.dateLabel}</div>
      </div>
      <a class="play-btn" href="${p.file}">Play</a>
    </div>
    <div class="board" id="board-${p.id}">
      <div class="loading-state">Loading scores…</div>
    </div>
  `;
  listEl.appendChild(card);

  const boardEl = card.querySelector('.board');

  const q = query(collection(db, 'scores'), where('puzzleId', '==', p.id));
  onSnapshot(q, (snap)=>{
    const rows = [];
    snap.forEach(doc=>rows.push(doc.data()));
    rows.sort((a,b)=>(a.timeMs||0)-(b.timeMs||0));
    const top = rows.slice(0,10);

    if(top.length===0){
      boardEl.innerHTML = '<div class="empty-state">No scores yet — be the first!</div>';
      return;
    }

    let html = '<table class="scores"><thead><tr><th class="num">#</th><th>Initials</th><th style="text-align:right;">Time</th></tr></thead><tbody>';
    top.forEach((row,i)=>{
      html += `<tr class="rank-${i+1}"><td class="rank">${i+1}</td><td class="initials">${(row.initials||'???').toUpperCase()}</td><td class="time">${formatTime(row.timeMs||0)}</td></tr>`;
    });
    html += '</tbody></table>';
    boardEl.innerHTML = html;
  }, (err)=>{
    boardEl.innerHTML = '<div class="error-state">Couldn\'t load scores.</div>';
    console.error(err);
  });
});

if(hashId){
  const target = document.getElementById(hashId);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
</body>
</html>
