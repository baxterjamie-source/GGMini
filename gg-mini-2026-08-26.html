<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The GG Mini</title>
<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --line:#000;
    --selected-cell:#ffe23e;
    --selected-word:#c8e6ff;
    --black-square:#000;
    --correct:#7cc576;
    --gray:#f6f6f6;
    --border-gray:#d3d6da;
  }
  html{
    overflow-y:scroll;
    scrollbar-gutter:stable;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  body{
    width:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .app{
    width:100%;
    max-width:420px;
    padding:18px 14px 28px;
  }
  .masthead{
    text-align:center;
    margin-bottom:10px;
  }
  .masthead .kicker{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#767676;
    font-weight:600;
  }
  .masthead h1{
    font-family:"Times New Roman",Georgia,serif;
    font-weight:700;
    font-size:34px;
    margin:2px 0 0;
    letter-spacing:0.5px;
  }
  .masthead .puzzle-date{
    font-size:12px;
    color:#767676;
    margin-top:4px;
  }
  .meta-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    font-size:13px;
    color:#555;
    margin:10px 2px 14px;
    font-variant-numeric:tabular-nums;
  }
  #timer{font-weight:600;color:#000;}

  .grid-wrap{
    width:100%;
    aspect-ratio:1/1;
    margin:0 auto;
    border:2px solid var(--line);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    width:100%;
    height:100%;
  }
  .cell{
    position:relative;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .cell.black{
    background:var(--black-square);
    cursor:default;
  }
  .cell.selected-word{background:var(--selected-word);}
  .cell.selected{background:var(--selected-cell);}
  .cell .num{
    position:absolute;
    top:2px;left:3px;
    font-size:10px;
    font-weight:700;
    color:#333;
    line-height:1;
  }
  .cell .letter{
    font-size:clamp(20px,6vw,30px);
    font-weight:500;
    color:#000;
    text-transform:uppercase;
    line-height:1;
  }
  .cell.correct-flash .letter{color:#1a7a1a;}

  .clue-bar{
    margin-top:14px;
    background:var(--gray);
    border-radius:6px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:46px;
  }
  .clue-bar .dir-toggle{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:#000;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .clue-bar .next-toggle{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:#000;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .clue-bar .clue-text{
    font-size:15px;
    font-weight:500;
    flex:1;
  }
  .clue-bar .clue-text b{font-weight:700;margin-right:5px;}

  .win-overlay{
    position:fixed;inset:0;
    background:rgba(255,255,255,0.97);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:24px;
    z-index:10;
  }
  .win-overlay.show{display:flex;}
  .win-overlay .check{
    width:64px;height:64px;
    border-radius:50%;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    animation:pop 0.4s ease;
  }
  .win-overlay .check svg{width:32px;height:32px;stroke:#fff;}
  @keyframes pop{
    0%{transform:scale(0);}
    70%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .win-overlay h2{
    font-family:"Times New Roman",Georgia,serif;
    font-size:26px;
    margin:0 0 6px;
  }
  .win-overlay p{
    font-size:14px;
    color:#555;
    margin:0 0 20px;
  }
  .win-overlay button{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.3px;
    padding:10px 20px;
    border-radius:20px;
    border:none;
    background:#000;
    color:#fff;
    cursor:pointer;
  }
  @media (prefers-reduced-motion: reduce){
    .win-overlay .check{animation:none;}
  }

  .score-form{
    margin-bottom:18px;
  }
  .score-form label{
    display:block;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#767676;
    margin-bottom:8px;
  }
  .initials-row{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .initials-row input{
    width:70px;
    height:48px;
    font-family:inherit;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-align:center;
    text-transform:uppercase;
    border:2px solid #000;
    border-radius:6px;
    padding:0 0 0 4px;
  }
  .initials-row button{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.3px;
    padding:0 18px;
    border-radius:20px;
    border:none;
    background:#000;
    color:#fff;
    cursor:pointer;
  }
  .initials-row button:disabled{
    opacity:0.5;
    cursor:default;
  }
  .score-msg{
    font-size:12px;
    margin-top:8px;
    min-height:16px;
  }
  .score-msg.error{color:#b0332e;}
  .mini-board{
    margin:0 0 18px;
    text-align:left;
    border:1px solid var(--border-gray);
    border-radius:8px;
    overflow:hidden;
  }
  .mini-board table{width:100%;border-collapse:collapse;}
  .mini-board td, .mini-board th{
    padding:6px 12px;
    font-size:13px;
  }
  .mini-board th{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#767676;
    text-align:left;
    background:var(--gray);
  }
  .mini-board td.time{text-align:right;font-variant-numeric:tabular-nums;}
  .leaderboard-link{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:#000;
    text-decoration:underline;
    margin-bottom:16px;
  }

  #sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  .keyboard{
    margin-top:16px;
    user-select:none;
  }
  .kb-row{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-bottom:6px;
  }
  .key{
    flex:1;
    max-width:32px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--gray);
    border:1px solid var(--border-gray);
    border-radius:5px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:#000;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .key:active{background:var(--border-gray);}
  .key.wide{
    flex:1.8;
    max-width:56px;
    font-size:16px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="kicker">Crossword</div>
    <h1>The GG Mini</h1>
    <div class="puzzle-date">August 26, 2026 · Puzzle 1</div>
  </div>
  <div class="meta-row">
    <span id="timer">0:00</span>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="clue-bar">
    <div class="dir-toggle" id="dirToggle" title="Switch direction">↴</div>
    <div class="clue-text" id="clueText"><b>1A</b> Placeholder</div>
    <div class="next-toggle" id="nextClue" title="Next clue">›</div>
  </div>

  <div class="keyboard" id="keyboard"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
  <h2 id="winTitle">You solved it!</h2>
  <p id="winTime">Your time: 0:00</p>

  <div class="score-form" id="scoreForm">
    <label for="initialsInput" id="initialsLabel">Enter your initials</label>
    <div class="initials-row">
      <input type="text" id="initialsInput" maxlength="3" autocomplete="off" autocapitalize="characters" placeholder="AAA">
      <button id="submitScoreBtn">Save</button>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
  </div>

  <div class="score-msg" id="alreadyLoggedMsg" style="display:none;"></div>

  <div class="mini-board" id="miniBoard" style="display:none;"></div>

  <a class="leaderboard-link" id="leaderboardLink" href="archive.html#gg-mini-2026-08-26">View full leaderboard →</a>
  <button id="closeWin">Close</button>
</div>

<div id="sr-live" aria-live="polite"></div>

<script src="messages.js"></script>
<script>
/* ---------- Puzzle data ----------
   Original 5x5 grid, own words and clues, in the style of the NYT Mini.
   '#' marks a black square.
*/
const SOLUTION = [
  ['S','C','A','R','#'],
  ['L','A','D','E','N'],
  ['A','R','O','S','E'],
  ['P','A','R','I','S'],
  ['#','T','E','N','T'],
];

const CLUES = {
  across: {
    1: "Reminder of an old wound",
    5: "Heavily loaded, as a tray",
    7: "Got up, or came about",
    8: "City of Light",
    9: "Defense against mosquitos"
  },
  down: {
    1: "Quick smack",
    2: "Diamond weight unit",
    3: "Love deeply",
    4: "Violin bow additive, or tree secretion",
    6: "Bird's home"
  }
};

const ROWS = 5, COLS = 5;
const PUZZLE_ID = 'gg-mini-2026-08-26';

// ---------- Build numbering + word maps ----------
const numberGrid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
const acrossWords = {}; // number -> {cells:[[r,c],...]}
const downWords = {};

(function number(){
  let n = 1;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(SOLUTION[r][c]==='#') continue;
      const startsAcross = (c===0 || SOLUTION[r][c-1]==='#') && (c+1<COLS && SOLUTION[r][c+1]!=='#');
      const startsDown = (r===0 || SOLUTION[r-1][c]==='#') && (r+1<ROWS && SOLUTION[r+1][c]!=='#');
      if(startsAcross || startsDown){
        numberGrid[r][c] = n;
        if(startsAcross){
          const cells=[]; let cc=c;
          while(cc<COLS && SOLUTION[r][cc]!=='#'){cells.push([r,cc]);cc++;}
          acrossWords[n] = {cells};
        }
        if(startsDown){
          const cells=[]; let rr=r;
          while(rr<ROWS && SOLUTION[rr][c]!=='#'){cells.push([rr,c]);rr++;}
          downWords[n] = {cells};
        }
        n++;
      }
    }
  }
})();

const WORD_ORDER = [
  ...Object.keys(acrossWords).map(n=>({num:+n, dir:'across'})),
  ...Object.keys(downWords).map(n=>({num:+n, dir:'down'}))
];

function jumpToNextWord(curNum, curDir){
  const idx = WORD_ORDER.findIndex(w=>w.num===curNum && w.dir===curDir);
  if(idx===-1) return;
  for(let i=1;i<=WORD_ORDER.length;i++){
    const next = WORD_ORDER[(idx+i)%WORD_ORDER.length];
    const cells = (next.dir==='across' ? acrossWords : downWords)[next.num].cells;
    const emptyCell = cells.find(([rr,cc])=>!state.grid[rr][cc]);
    const target = emptyCell || cells[0];
    state.dir = next.dir;
    state.selR = target[0];
    state.selC = target[1];
    render();
    return;
  }
}

function jumpToPrevWord(curNum, curDir){
  const idx = WORD_ORDER.findIndex(w=>w.num===curNum && w.dir===curDir);
  if(idx===-1) return;
  for(let i=1;i<=WORD_ORDER.length;i++){
    const prev = WORD_ORDER[(idx-i+WORD_ORDER.length)%WORD_ORDER.length];
    const cells = (prev.dir==='across' ? acrossWords : downWords)[prev.num].cells;
    const emptyCell = cells.find(([rr,cc])=>!state.grid[rr][cc]);
    const target = emptyCell || cells[0];
    state.dir = prev.dir;
    state.selR = target[0];
    state.selC = target[1];
    render();
    return;
  }
}

function cellToWordNumber(r,c,dir){
  const words = dir==='across' ? acrossWords : downWords;
  for(const num in words){
    if(words[num].cells.some(([rr,cc])=>rr===r&&cc===c)) return parseInt(num);
  }
  return null;
}

// ---------- State ----------
const state = {
  grid: Array.from({length:ROWS},()=>Array(COLS).fill('')),
  dir: 'across',
  selR: 0, selC: 0,
  startTime: Date.now(),
  timerInterval: null,
  solved: false
};

// ---------- Progress persistence (localStorage) ----------
const STORAGE_KEY = 'gg-mini-progress::' + SOLUTION.map(r=>r.join('')).join('|');

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      grid: state.grid,
      elapsedMs: Date.now() - state.startTime,
      solved: state.solved
    }));
  }catch(e){ /* storage unavailable — fail silently */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data && Array.isArray(data.grid) && data.grid.length===ROWS){
      state.grid = data.grid;
    }
    if(data && typeof data.elapsedMs === 'number'){
      state.startTime = Date.now() - data.elapsedMs;
    }
    if(data && data.solved){
      state.solved = true;
    }
  }catch(e){ /* corrupt or unavailable — start fresh */ }
}

loadProgress();

// find first playable cell
outer:
for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){if(SOLUTION[r][c]!=='#'){state.selR=r;state.selC=c;break outer;}}}

// ---------- Render grid ----------
const gridEl = document.getElementById('grid');
function buildGrid(){
  gridEl.innerHTML='';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const div = document.createElement('div');
      div.className='cell';
      div.dataset.r=r; div.dataset.c=c;
      if(SOLUTION[r][c]==='#'){
        div.classList.add('black');
      }else{
        if(numberGrid[r][c]){
          const num = document.createElement('div');
          num.className='num';
          num.textContent = numberGrid[r][c];
          div.appendChild(num);
        }
        const letter = document.createElement('div');
        letter.className='letter';
        div.appendChild(letter);
        div.addEventListener('click', ()=>onCellClick(r,c));
      }
      gridEl.appendChild(div);
    }
  }
}
buildGrid();

function onCellClick(r,c){
  if(state.selR===r && state.selC===c){
    // toggle direction if possible
    const otherDir = state.dir==='across' ? 'down' : 'across';
    if(cellToWordNumber(r,c,otherDir)!==null){
      state.dir = otherDir;
    }
  }else{
    state.selR=r; state.selC=c;
    // prefer current direction if word exists there, else switch
    if(cellToWordNumber(r,c,state.dir)===null){
      state.dir = state.dir==='across' ? 'down' : 'across';
    }
  }
  render();
}

// ---------- Render selection + letters ----------
function render(){
  const curNum = cellToWordNumber(state.selR, state.selC, state.dir);
  const words = state.dir==='across' ? acrossWords : downWords;
  const activeCells = curNum!==null ? words[curNum].cells : [];

  document.querySelectorAll('.cell').forEach(div=>{
    const r=+div.dataset.r, c=+div.dataset.c;
    if(div.classList.contains('black')) return;
    div.classList.remove('selected','selected-word');
    const inWord = activeCells.some(([rr,cc])=>rr===r&&cc===c);
    if(inWord) div.classList.add('selected-word');
    if(r===state.selR && c===state.selC) div.classList.add('selected');
    const letterEl = div.querySelector('.letter');
    letterEl.textContent = state.grid[r][c] || '';
  });

  // clue bar
  const clueTextEl = document.getElementById('clueText');
  if(curNum!==null){
    const label = curNum + (state.dir==='across' ? 'A' : 'D');
    const text = state.dir==='across' ? CLUES.across[curNum] : CLUES.down[curNum];
    clueTextEl.innerHTML = `<b>${label}</b> ${text}`;
  }
}
render();

// ---------- On-screen keyboard (avoids popping the native mobile keyboard) ----------
const KB_ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const keyboardEl = document.getElementById('keyboard');
function buildKeyboard(){
  keyboardEl.innerHTML='';
  KB_ROWS.forEach((rowStr, idx)=>{
    const rowEl = document.createElement('div');
    rowEl.className='kb-row';
    rowStr.split('').forEach(letter=>{
      const keyEl = document.createElement('div');
      keyEl.className='key';
      keyEl.textContent=letter;
      keyEl.setAttribute('role','button');
      keyEl.setAttribute('aria-label','Letter '+letter);
      keyEl.addEventListener('click', ()=>{
        if(state.solved) return;
        placeLetter(letter);
      });
      rowEl.appendChild(keyEl);
    });
    if(idx===2){
      const bsEl = document.createElement('div');
      bsEl.className='key wide';
      bsEl.textContent='⌫';
      bsEl.setAttribute('role','button');
      bsEl.setAttribute('aria-label','Backspace');
      bsEl.addEventListener('click', ()=>{
        if(state.solved) return;
        backspace();
      });
      rowEl.appendChild(bsEl);
    }
    keyboardEl.appendChild(rowEl);
  });
}
buildKeyboard();

// ---------- Physical keyboard support (desktop) ----------
document.addEventListener('keydown', (e)=>{
  if(state.solved) return;
  if(e.key==='ArrowRight'){ move(0,1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ move(0,-1); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ move(1,0); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ move(-1,0); e.preventDefault(); }
  else if(e.key==='Backspace'){ backspace(); e.preventDefault(); }
  else if(e.key===' '){ 
    const otherDir = state.dir==='across' ? 'down' : 'across';
    if(cellToWordNumber(state.selR,state.selC,otherDir)!==null) state.dir=otherDir;
    render(); e.preventDefault();
  }
  else if(e.key==='Tab'){
    const curNum = cellToWordNumber(state.selR, state.selC, state.dir);
    if(curNum!==null){
      if(e.shiftKey) jumpToPrevWord(curNum, state.dir);
      else jumpToNextWord(curNum, state.dir);
    }
    e.preventDefault();
  }
  else if(e.key.length===1 && /[a-zA-Z]/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey){
    placeLetter(e.key.toUpperCase());
    e.preventDefault();
  }
});

function move(dr,dc){
  let r=state.selR+dr, c=state.selC+dc;
  if(r<0||r>=ROWS||c<0||c>=COLS) return;
  if(SOLUTION[r][c]==='#') return;
  state.selR=r; state.selC=c;
  render();
}

function placeLetter(ch){
  if(state.solved) return;
  const {selR:r, selC:c} = state;
  state.grid[r][c] = ch;
  render();

  const words = state.dir==='across' ? acrossWords : downWords;
  const num = cellToWordNumber(r, c, state.dir);
  const cells = words[num].cells;
  const idxInWord = cells.findIndex(([rr,cc])=>rr===r&&cc===c);
  const isLastCell = idxInWord === cells.length-1;
  const wordComplete = cells.every(([rr,cc])=>state.grid[rr][cc]);

  if(isLastCell && wordComplete){
    jumpToNextWord(num, state.dir);
  }else{
    advance();
  }
  checkAutoComplete();
  saveProgress();
}

function advance(){
  const words = state.dir==='across' ? acrossWords : downWords;
  const num = cellToWordNumber(state.selR, state.selC, state.dir);
  if(num===null) return;
  const cells = words[num].cells;
  const idx = cells.findIndex(([r,c])=>r===state.selR&&c===state.selC);
  if(idx>-1 && idx<cells.length-1){
    const [nr,nc] = cells[idx+1];
    state.selR=nr; state.selC=nc;
    render();
  }
}

function backspace(){
  const {selR:r, selC:c} = state;
  if(state.grid[r][c]){
    state.grid[r][c]='';
    render();
  }else{
    const words = state.dir==='across' ? acrossWords : downWords;
    const num = cellToWordNumber(r,c,state.dir);
    if(num===null) return;
    const cells = words[num].cells;
    const idx = cells.findIndex(([rr,cc])=>rr===r&&cc===c);
    if(idx>0){
      const [pr,pc] = cells[idx-1];
      state.selR=pr; state.selC=pc;
      state.grid[pr][pc]='';
      render();
    }
  }
  saveProgress();
}

// ---------- Timer ----------
const timerEl = document.getElementById('timer');
function tick(){
  const secs = Math.floor((Date.now()-state.startTime)/1000);
  const m = Math.floor(secs/60), s = secs%60;
  timerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}
if(state.solved){
  tick();
}else{
  state.timerInterval = setInterval(tick, 1000);
  tick();
}

function checkAutoComplete(){
  let full = true;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(SOLUTION[r][c]!=='#' && !state.grid[r][c]) full=false;
  }
  if(!full) return;
  let allCorrect = true;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(SOLUTION[r][c]!=='#' && state.grid[r][c]!==SOLUTION[r][c]) allCorrect=false;
  }
  if(allCorrect && !state.solved){
    state.solved = true;
    state.solvedTimeMs = Date.now() - state.startTime;
    clearInterval(state.timerInterval);
    document.getElementById('winTime').textContent = MSG.winTime(timerEl.textContent);
    document.getElementById('winOverlay').classList.add('show');
    resetScoreForm();
    saveProgress();
  }
}

document.getElementById('dirToggle').addEventListener('click', ()=>{
  const otherDir = state.dir==='across' ? 'down' : 'across';
  if(cellToWordNumber(state.selR,state.selC,otherDir)!==null){
    state.dir = otherDir;
    render();
  }
});

document.getElementById('nextClue').addEventListener('click', ()=>{
  const curNum = cellToWordNumber(state.selR, state.selC, state.dir);
  if(curNum!==null) jumpToNextWord(curNum, state.dir);
});

document.getElementById('closeWin').addEventListener('click', ()=>{
  document.getElementById('winOverlay').classList.remove('show');
});

window.addEventListener('beforeunload', saveProgress);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') saveProgress();
});

// ---------- One score per device ----------
const SCORED_KEY = 'gg-mini-scored::' + PUZZLE_ID;
function hasScored(){
  try{ return localStorage.getItem(SCORED_KEY) === '1'; }catch(e){ return false; }
}
function markScored(){
  try{ localStorage.setItem(SCORED_KEY, '1'); }catch(e){ /* storage unavailable */ }
}

let _fb = null;
async function getFirebase(){
  if(_fb) return _fb;
  const [{ initializeApp }, fs] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js')
  ]);
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  _fb = { db, fs };
  return _fb;
}

// Persistent random per-browser token — generated once, reused for every
// puzzle on this site. Not tied to network/IP, so different people on the
// same wifi each get their own token and don't block each other.
function getDeviceToken(){
  const KEY = 'gg-mini-device-token';
  try{
    let tok = localStorage.getItem(KEY);
    if(!tok){
      tok = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
      localStorage.setItem(KEY, tok);
    }
    return tok;
  }catch(e){
    return null; // storage unavailable — score still saves, just without the device-level lock
  }
}

async function submitScore(initials, timeMs){
  const { db, fs } = await getFirebase();
  const token = getDeviceToken();

  const batch = fs.writeBatch(db);
  const scoreRef = fs.doc(fs.collection(db, 'scores'));
  batch.set(scoreRef, {
    puzzleId: PUZZLE_ID,
    initials,
    timeMs,
    createdAt: fs.serverTimestamp()
  });

  if(token){
    // Deterministic doc ID (puzzle + device token): Firestore's create-only
    // rule on this collection rejects a second write to the same ID,
    // enforcing one score per browser per puzzle. Not publicly readable.
    const lockRef = fs.doc(db, 'deviceLocks', PUZZLE_ID + '::' + token);
    batch.set(lockRef, {
      puzzleId: PUZZLE_ID,
      token,
      createdAt: fs.serverTimestamp()
    });
  }

  await batch.commit();
}

async function loadTopScores(max){
  const { db, fs } = await getFirebase();
  const q = fs.query(fs.collection(db, 'scores'), fs.where('puzzleId', '==', PUZZLE_ID));
  const snap = await fs.getDocs(q);
  const rows = [];
  snap.forEach(doc=>rows.push(doc.data()));
  rows.sort((a,b)=>(a.timeMs||0)-(b.timeMs||0));
  return rows.slice(0, max);
}

function formatMs(ms){
  const secs = Math.floor(ms/1000);
  const m = Math.floor(secs/60), s = secs%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function resetScoreForm(){
  const form = document.getElementById('scoreForm');
  const alreadyMsg = document.getElementById('alreadyLoggedMsg');
  const input = document.getElementById('initialsInput');
  const btn = document.getElementById('submitScoreBtn');
  const msg = document.getElementById('scoreMsg');
  const mini = document.getElementById('miniBoard');

  msg.textContent = '';
  msg.classList.remove('error');
  mini.style.display = 'none';
  mini.innerHTML = '';

  if(hasScored()){
    form.style.display = 'none';
    alreadyMsg.style.display = '';
    alreadyMsg.textContent = MSG.alreadyLoggedText;
  }else{
    form.style.display = '';
    alreadyMsg.style.display = 'none';
    input.value = '';
    input.disabled = false;
    btn.disabled = false;
  }
}

const initialsInput = document.getElementById('initialsInput');
const submitScoreBtn = document.getElementById('submitScoreBtn');
const scoreMsg = document.getElementById('scoreMsg');

initialsInput.addEventListener('input', ()=>{
  initialsInput.value = initialsInput.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
});
initialsInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter') submitScoreBtn.click();
});

submitScoreBtn.addEventListener('click', async ()=>{
  if(hasScored()){
    resetScoreForm();
    return;
  }
  const initials = initialsInput.value.trim();
  if(initials.length!==3){
    scoreMsg.textContent = MSG.invalidInitialsText;
    scoreMsg.classList.add('error');
    return;
  }
  initialsInput.disabled = true;
  submitScoreBtn.disabled = true;
  scoreMsg.classList.remove('error');
  scoreMsg.textContent = MSG.savingText;
  try{
    await submitScore(initials, state.solvedTimeMs || 0);
    markScored();
    scoreMsg.textContent = MSG.savedText;
    document.getElementById('scoreForm').style.display = 'none';
    try{
      const top = await loadTopScores(5);
      const mini = document.getElementById('miniBoard');
      let html = '<table><thead><tr><th>#</th><th>Initials</th><th style="text-align:right;">Time</th></tr></thead><tbody>';
      top.forEach((row,i)=>{
        html += `<tr><td>${i+1}</td><td>${(row.initials||'').toUpperCase()}</td><td class="time">${formatMs(row.timeMs||0)}</td></tr>`;
      });
      html += '</tbody></table>';
      mini.innerHTML = html;
      mini.style.display = '';
    }catch(e){ /* leaderboard preview optional — ignore failure */ }
  }catch(e){
    console.error(e);
    if(e && e.code === 'permission-denied'){
      // Most likely: a score was already logged from this network for this puzzle.
      markScored();
      resetScoreForm();
    }else{
      scoreMsg.textContent = MSG.saveErrorText;
      scoreMsg.classList.add('error');
      initialsInput.disabled = false;
      submitScoreBtn.disabled = false;
    }
  }
});
